<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>

<body>
    <fieldset>
        <legend>Regiser</legend>
        <form action="" method="post">

            <label for="">

            <button type="submit">Register</button>
        </form>
        <a href="/login">Login</a>
    </fieldset>
</body>

</html>
